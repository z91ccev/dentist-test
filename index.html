<head>

<style>
:root{--bg:#f4f3ef;--fg:#111;--mute:#6b6b66;--line:#d9d7d0;--card:#fff;--acc:#1f5f4a;--accfg:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0f0e;--fg:#f1f0ea;--mute:#8d8d86;--line:#272825;--card:#161716;--acc:#7fd1b0;--accfg:#08130e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e0f0e;--fg:#f1f0ea;--mute:#8d8d86;--line:#272825;--card:#161716;--acc:#7fd1b0;--accfg:#08130e;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{background:var(--bg);color:var(--fg);font-family:"Inter Tight",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.wrap{max-width:1280px;margin:0 auto;padding:0 24px}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;gap:12px}
.logo{font-weight:600;font-size:20px;letter-spacing:-.02em}
nav{display:flex;gap:28px;font-size:14px}
nav a:hover{color:var(--acc)}
.ctl{display:flex;gap:8px;align-items:center}
.pill{border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:99px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.pill.on{background:var(--fg);color:var(--bg)}
.btn{display:inline-flex;align-items:center;gap:8px;background:#fff;color:#111;border:1px solid var(--line);border-radius:99px;padding:14px 26px;font:inherit;font-weight:500;cursor:pointer;transition:background .25s,color .25s,border-color .25s}.btn:hover:not(:disabled){background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.hero{padding:80px 0 40px}
.hero h1{font-size:clamp(64px,17vw,230px);line-height:.85;letter-spacing:-.06em;font-weight:500}
.hero h1 span{color:var(--acc)}
.hero p{max-width:560px;font-size:20px;margin:36px 0 28px}
.sub{color:var(--mute);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);margin-top:60px}
.stat{padding:28px 0;border-right:1px solid var(--line);padding-left:20px}
.stat:first-child{padding-left:0}.stat:last-child{border:0}
.stat b{display:block;font-size:clamp(36px,6vw,80px);font-weight:400;letter-spacing:-.04em;line-height:1}
section{padding:90px 0;border-top:1px solid var(--line)}
h2{font-size:clamp(32px,5vw,64px);letter-spacing:-.04em;font-weight:500;line-height:1;margin-bottom:12px}
.lead{max-width:640px;color:var(--mute);font-size:18px;margin-bottom:48px}
.svc{display:grid;grid-template-columns:80px 1fr 1fr;gap:24px;padding:32px 0;border-top:1px solid var(--line)}
.svc i{font-style:normal;color:var(--mute);font-size:14px}
.svc h3{font-size:28px;font-weight:500;letter-spacing:-.02em;margin-bottom:8px}
.svc p{color:var(--mute)}
.svc ul{list-style:none;padding:0;font-size:15px}
.svc li{padding:6px 0;border-bottom:1px solid var(--line)}
.team{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px}
.mem .ph img{width:100%;height:100%;object-fit:cover;display:block}.mem .ph{overflow:hidden;aspect-ratio:1;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:56px;font-weight:300;color:var(--acc);margin-bottom:12px}
.mem b{font-weight:500;display:block}
.quote{display:grid;grid-template-columns:1.6fr 1fr;gap:48px}
.quote blockquote{font-size:clamp(20px,2.4vw,30px);letter-spacing:-.02em;line-height:1.3}
.book{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:32px;max-width:860px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:6px}
input,select{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit}
.slots{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 20px}
.slot{border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:10px;padding:9px 14px;font:inherit;cursor:pointer}
.slot.sel{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.slot:disabled{opacity:.3;text-decoration:line-through;cursor:not-allowed}
.cal{max-width:340px;margin:4px 0 20px}.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;text-transform:capitalize}.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cw{font-size:12px;color:var(--mute);text-align:center;padding:4px 0;text-transform:capitalize}.cd{aspect-ratio:1;border:1px solid transparent;background:transparent;color:var(--fg);border-radius:10px;font:inherit;cursor:pointer}.cd:hover:not(:disabled){border-color:var(--acc)}.cd.sel{background:var(--acc);color:var(--accfg)}.cd:disabled{opacity:.25;cursor:not-allowed}.pill:disabled{opacity:.3;cursor:not-allowed}.ok{display:none;text-align:center;padding:24px 0}.ok h3{font-size:30px;margin-bottom:8px}
.err{color:#c0392b;font-size:14px;min-height:20px;margin:10px 0}
.rv{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}.rc{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:24px;display:flex;flex-direction:column;justify-content:space-between;gap:20px}.rc p{font-size:18px;letter-spacing:-.01em}.stars{color:var(--acc);letter-spacing:3px}.loc{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}.map{aspect-ratio:4/3;border:1px solid var(--line);border-radius:20px;background:repeating-linear-gradient(0deg,transparent 0 39px,var(--line) 39px 40px),repeating-linear-gradient(90deg,transparent 0 39px,var(--line) 39px 40px),var(--card);display:grid;place-items:center;font-size:56px}.btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}.map{background:var(--card);overflow:hidden;padding:0}.map svg{width:100%;height:100%;display:block}.map .st{stroke:var(--line);fill:none;stroke-linecap:round}.map .mj{stroke-width:9}.map .mn{stroke-width:3}.map .bl{fill:var(--bg)}.map .pk{fill:var(--acc);opacity:.14}.map .rv2{stroke:var(--acc);opacity:.2;fill:none;stroke-width:28;stroke-linecap:round}.map .pn{fill:var(--acc)}.map .pi{fill:var(--accfg)}.map .lb{fill:var(--fg)}.map .lt{fill:var(--bg);font:500 12px "Inter Tight",system-ui,sans-serif}.map .sc{stroke:var(--mute);stroke-width:2;fill:none}.map .tx{fill:var(--mute);font:11px "Inter Tight",system-ui,sans-serif}.map .pg{transition:transform .3s}.map:hover .pg{transform:translateY(-6px)}
footer{border-top:1px solid var(--line);padding:50px 0 40px}
footer .wrap{display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between;font-size:14px}
.big{font-size:clamp(40px,9vw,120px);letter-spacing:-.05em;line-height:.9;font-weight:500;margin-bottom:40px}
@media(max-width:760px){nav{display:none}.svc,.quote,.grid2,.loc{grid-template-columns:1fr}.stat{padding-left:10px}.book{padding:20px}}
</style>
